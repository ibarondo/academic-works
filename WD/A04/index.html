<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flagpedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="assets/globe.png">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow sticky-top">
        <div class="container-fluid">
            <div class="col d-flex align-items-center">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="assets/globe.png" alt="Logo" width="40" height="40" class="d-inline-block align-text-top">
                    <span class="ms-2" style="line-height: 1.2;"><b>Flagpedia</b></span>
                </a>

                <div class="ms-auto d-flex">
                    <div class="position-relative">
                        <input type="text" class="form-control ps-4" placeholder="Country Name or Code"
                            id="searchTerm" />
                        <button type="button" class="search-btn position-absolute" id="search-btn"
                            onclick="searchCountry()">
                            <i class="bi bi-search" style="font-size: 20px"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mt-4">
            <div class="col">
                <h1 class="display-3">Flag Gallery</h1>
            </div>
        </div>
        <div class="row" id="cardContainer">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="js/script.js"></script>
</body>

</html>
